name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Create project files
        run: |
          mkdir -p app/src/main/res/values app/src/main/res/xml app/src/main/java/com/scan/meters
          cat > settings.gradle <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = 'MeterScanner'
          include ':app'
          EOF_FILE
          cat > build.gradle <<'EOF_FILE'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF_FILE
          cat > gradle.properties <<'EOF_FILE'
          android.useAndroidX=true
          EOF_FILE
          cat > app/build.gradle <<'EOF_FILE'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.scan.meters'
              compileSdk 34
              defaultConfig { applicationId 'com.scan.meters'; minSdk 29; targetSdk 34; versionCode 1; versionName '1.0' }
              compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="Meter Scanner" android:theme="@android:style/Theme.Material.Light.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".ScanService" android:exported="true" android:label="Meter Scanner"
                  android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                <intent-filter><action android:name="android.accessibilityservice.AccessibilityService"/></intent-filter>
                <meta-data android:name="android.accessibilityservice" android:resource="@xml/accessibility_config"/>
              </service>
            </application>
          </manifest>
          EOF_FILE
          cat > app/src/main/res/values/strings.xml <<'EOF_FILE'
          <resources><string name="desc">يقرأ بيانات العدادات الظاهرة على الشاشة ويحفظها</string></resources>
          EOF_FILE
          cat > app/src/main/res/xml/accessibility_config.xml <<'EOF_FILE'
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowContentChanged|typeWindowStateChanged|typeViewTextChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagIncludeNotImportantViews|flagReportViewIds"
              android:canRetrieveWindowContent="true"
              android:canPerformGestures="true"
              android:notificationTimeout="300"
              android:description="@string/desc"/>
          EOF_FILE
          cat > app/src/main/java/com/scan/meters/Store.java <<'EOF_FILE'
          package com.scan.meters;
          import android.content.Context;
          import java.io.*;
          import java.util.*;

          class Store {
              static final LinkedHashMap<String, String[]> rows = new LinkedHashMap<>();
              static File file;
              static String last = "-";
              static volatile boolean auto = false;
              static volatile String msg = "";

              static synchronized void init(Context c) {
                  if (file != null) return;
                  file = new File(c.getFilesDir(), "data.tsv");
                  if (!file.exists()) return;
                  try (BufferedReader r = new BufferedReader(new InputStreamReader(new FileInputStream(file), "UTF-8"))) {
                      String l;
                      while ((l = r.readLine()) != null) {
                          String[] p = l.split("\t", -1);
                          if (p.length >= 8) rows.put(p[0], p);
                      }
                  } catch (Exception ignored) {}
              }

              static synchronized boolean put(String[] row) {
                  String[] old = rows.get(row[0]);
                  if (old != null && Arrays.equals(Arrays.copyOf(old, 7), Arrays.copyOf(row, 7))) return false;
                  rows.put(row[0], row);
                  last = row[0] + "  →  " + row[3] + "  (" + row[6] + ")";
                  try (Writer w = new OutputStreamWriter(new FileOutputStream(file), "UTF-8")) {
                      for (String[] r : rows.values()) w.write(String.join("\t", r) + "\n");
                  } catch (Exception ignored) {}
                  return true;
              }

              static synchronized String csv() {
                  StringBuilder sb = new StringBuilder("\uFEFFmeter,contrat,ancien_index,nouvel_index,client,adresse,position,heure\n");
                  for (String[] r : rows.values()) {
                      for (int i = 0; i < r.length; i++) {
                          sb.append('"').append(r[i].replace("\"", "\"\"")).append('"');
                          if (i < r.length - 1) sb.append(',');
                      }
                      sb.append('\n');
                  }
                  return sb.toString();
              }
          }
          EOF_FILE
          cat > app/src/main/java/com/scan/meters/ScanService.java <<'EOF_FILE'
          package com.scan.meters;
          import android.accessibilityservice.AccessibilityService;
          import android.accessibilityservice.GestureDescription;
          import android.graphics.Path;
          import android.os.*;
          import android.util.DisplayMetrics;
          import android.view.accessibility.AccessibilityEvent;
          import android.view.accessibility.AccessibilityNodeInfo;
          import java.text.SimpleDateFormat;
          import java.util.*;

          public class ScanService extends AccessibilityService {
              Handler h = new Handler(Looper.getMainLooper());
              String prev = ""; int same = 0;
              Runnable loop = new Runnable() { public void run() {
                  try { step(); } catch (Exception ignored) {}
                  h.postDelayed(this, 1200); } };

              @Override protected void onServiceConnected() {
                  Store.init(this);
                  h.removeCallbacks(loop); h.postDelayed(loop, 1200);
              }
              @Override public void onInterrupt() {}

              @Override public void onAccessibilityEvent(AccessibilityEvent e) {
                  try { scan(); } catch (Exception ignored) {}
              }

              void step() {
                  if (!Store.auto) { same = 0; prev = ""; return; }
                  String[] row = scan();
                  if (row == null) return;
                  String[] pp = row[6].split("/");
                  try {
                      if (Integer.parseInt(pp[0]) >= Integer.parseInt(pp[1])) {
                          Store.auto = false; Store.msg = "انتهى: وصلنا لآخر بطاقة (" + row[6] + ")"; return; }
                  } catch (Exception ignored) {}
                  String key = row[0] + row[6];
                  if (key.equals(prev)) {
                      same++;
                      if (same >= 3) { Store.auto = false; Store.msg = "توقف: لم تتغير البطاقة (" + row[6] + ")"; return; }
                  } else { same = 0; prev = key; }
                  swipe();
              }

              void swipe() {
                  DisplayMetrics m = getResources().getDisplayMetrics();
                  Path p = new Path();
                  p.moveTo(m.widthPixels * 0.85f, m.heightPixels * 0.45f);
                  p.lineTo(m.widthPixels * 0.15f, m.heightPixels * 0.45f);
                  dispatchGesture(new GestureDescription.Builder()
                      .addStroke(new GestureDescription.StrokeDescription(p, 0, 300)).build(), null, null);
              }

              String[] scan() {
                  Store.init(this);
                  AccessibilityNodeInfo root = getRootInActiveWindow();
                  if (root == null) return null;
                  if (getPackageName().contentEquals(root.getPackageName())) return null;
                  List<String> t = new ArrayList<>();
                  collect(root, t);
                  return parse(t);
              }

              void collect(AccessibilityNodeInfo n, List<String> out) {
                  if (n == null) return;
                  CharSequence s = n.getText();
                  if (s == null || s.toString().trim().isEmpty()) s = n.getContentDescription();
                  if (s != null && !s.toString().trim().isEmpty()) out.add(s.toString().trim().replace("\t", " ").replace("\n", " "));
                  for (int i = 0; i < n.getChildCount(); i++) collect(n.getChild(i), out);
              }

              String after(List<String> t, String label) {
                  for (int i = 0; i < t.size(); i++) {
                      if (t.get(i).toUpperCase().startsWith(label)) {
                          String rest = t.get(i).substring(label.length()).trim();
                          if (!rest.isEmpty()) return rest;
                          if (i + 1 < t.size()) return t.get(i + 1);
                      }
                  }
                  return "";
              }

              String[] parse(List<String> t) {
                  String meter = "", pos = "", nouvel = "";
                  int p = -1;
                  for (int i = 0; i < t.size(); i++) {
                      String s = t.get(i);
                      if (meter.isEmpty() && s.matches("^(?=.*[A-Za-z])(?=.*\\d)[A-Za-z0-9]{8,}$")) meter = s;
                      if (p < 0 && s.matches("^\\d+\\s*/\\s*\\d+$")) { p = i; pos = s.replace(" ", ""); }
                  }
                  if (meter.isEmpty() || p < 0) return null;
                  if (p > 0 && t.get(p - 1).matches("^\\d+([.,]\\d+)?$")) nouvel = t.get(p - 1);
                  else if (p + 1 < t.size() && t.get(p + 1).matches("^\\d+([.,]\\d+)?$")) nouvel = t.get(p + 1);
                  String[] row = {meter, after(t, "N° CONTRAT"), after(t, "ANCIEN INDEX"), nouvel,
                          after(t, "CLIENT"), after(t, "ADRESSE"), pos,
                          new SimpleDateFormat("yyyy-MM-dd HH:mm:ss", Locale.US).format(new Date())};
                  Store.put(row);
                  return row;
              }
          }
          EOF_FILE
          cat > app/src/main/java/com/scan/meters/MainActivity.java <<'EOF_FILE'
          package com.scan.meters;
          import android.app.Activity;
          import android.content.*;
          import android.graphics.Color;
          import android.net.Uri;
          import android.os.*;
          import android.provider.MediaStore;
          import android.provider.Settings;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
              TextView status;
              Handler h = new Handler(Looper.getMainLooper());
              Runnable tick = new Runnable() { public void run() {
                  status.setText("عدد العدادات المحفوظة: " + Store.rows.size() + "\n\nآخر قراءة:\n" + Store.last + "\n\nالسحب التلقائي: " + (Store.auto ? "يعمل ▶" : "متوقف ■") + "\n" + Store.msg);
                  h.postDelayed(this, 1000); } };

              Button btn(String s, View.OnClickListener l) {
                  Button b = new Button(this); b.setText(s); b.setTextSize(18); b.setOnClickListener(l); return b;
              }

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Store.init(this);
                  LinearLayout ll = new LinearLayout(this);
                  ll.setOrientation(LinearLayout.VERTICAL); ll.setPadding(40, 80, 40, 40); ll.setGravity(Gravity.CENTER_HORIZONTAL);
                  TextView title = new TextView(this);
                  title.setText("Meter Scanner\n1) فعّل الخدمة  2) افتح تطبيق العدادات وتصفّح البطاقات  3) صدّر");
                  title.setTextSize(16); ll.addView(title);
                  status = new TextView(this); status.setTextSize(20); status.setTextColor(Color.BLACK); status.setPadding(0, 40, 0, 40);
                  ll.addView(status);
                  ll.addView(btn("1) تفعيل خدمة القراءة (إمكانية الوصول)", v -> startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))));
                  ll.addView(btn("4) تصدير إلى مجلد التنزيلات (CSV)", v -> export()));
                  ll.addView(btn("3) بدء / إيقاف السحب التلقائي", v -> { Store.auto = !Store.auto; Store.msg = ""; }));
                  setContentView(ll);
              }

              void export() {
                  try {
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Downloads.DISPLAY_NAME, "meters_" + System.currentTimeMillis() + ".csv");
                      v.put(MediaStore.Downloads.MIME_TYPE, "text/csv");
                      v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                      Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                      try (OutputStream os = getContentResolver().openOutputStream(u)) { os.write(Store.csv().getBytes("UTF-8")); }
                      Toast.makeText(this, "تم الحفظ في التنزيلات: " + Store.rows.size() + " عداد", Toast.LENGTH_LONG).show();
                  } catch (Exception e) { Toast.makeText(this, "فشل: " + e, Toast.LENGTH_LONG).show(); }
              }

              @Override protected void onResume() { super.onResume(); h.post(tick); }
              @Override protected void onPause() { super.onPause(); h.removeCallbacks(tick); }
          }
          EOF_FILE
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MeterScanner-apk
          path: app/build/outputs/apk/debug/app-debug.apk
